<!-- Login Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">

<span class="font-body-sm text-body-sm text-on-surface-variant select-none">Remember me</span>

</div>

<!-- Registration Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">

</div>
</div>
<!-- Supporter Username -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="reg-username">Username</label>

</div>

</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="reg-password">Password</label>

<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">lock</span>

<span class="material-symbols-outlined text-[20px]" id="reg-eye-1">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->

<label class="font-label-md text-label-md text-on-surface-variant" for="reg-confirm-password">Confirm Password</label>

<input class="w-full bg-surface-container-high rounded-full py-3.5 pl-12 pr-12 text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-bright focus:shadow-[0_0_14px_rgba(0,230,118,0.25)] transition-all" id="reg-confirm-password" placeholder="Repeat match password" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface p-1 transition-colors" onclick="togglePassVisibility('reg-confirm-password', 'reg-eye-2')" type="button">

</button>

</span>
</label>

<button class="w-full py-4 rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(0,230,118,0.4)] active:scale-[0.99] transition-transform mt-2" type="submit">

<!-- Fan Arena Live Fan Pulse Counter -->
<div class="mt-space-lg pt-space-md flex items-center justify-center gap-2 text-on-surface-variant">

<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">148,920 supporters currently live in terraces</span>
</div>
</div>
<script>
  function switchAuthTab(target) {
    const loginBtn = document.getElementById('tab-login');
    const registerBtn = document.getElementById('tab-register');
    const loginPanel = document.getElementById('panel-login');
    const registerPanel = document.getElementById('panel-register');

    if (target === 'login') {
      loginBtn.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center flex items-center justify-center gap-2 bg-primary-container text-on-primary-container shadow-[0_0_18px_rgba(0,230,118,0.35)]";
      registerBtn.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center flex items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface";
      loginPanel.classList.remove('hidden');
      registerPanel.classList.add('hidden');
    } else {
      registerBtn.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center flex items-center justify-center gap-2 bg-primary-container text-on-primary-container shadow-[0_0_18px_rgba(0,230,118,0.35)]";
      loginBtn.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-center flex items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface";
      registerPanel.classList.remove('hidden');
      loginPanel.classList.add('hidden');
    }
  }

  function togglePassVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>
