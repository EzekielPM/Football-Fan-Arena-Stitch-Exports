name: Extract Google Stitch screen batches

on:
  push:
    paths:
      - ".github/workflows/extract-stitch-zips.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out export repository
        uses: actions/checkout@v4

      - name: Extract all three screen batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/FFA-Batch-1 extracted/FFA-Batch-2 extracted/FFA-Batch-3
          unzip -q "FFA Batch 1_035118.zip" -d extracted/FFA-Batch-1
          unzip -q "FFA Batch 2_034848.zip" -d extracted/FFA-Batch-2
          unzip -q "FFA Batch 3_035358.zip" -d extracted/FFA-Batch-3
          echo "Batch 1 files: $(find extracted/FFA-Batch-1 -type f | wc -l)"
          echo "Batch 2 files: $(find extracted/FFA-Batch-2 -type f | wc -l)"
          echo "Batch 3 files: $(find extracted/FFA-Batch-3 -type f | wc -l)"

      - name: Commit extracted screen folders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract Google Stitch screen batches"
            git push
          fi
